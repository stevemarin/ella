[project]
name = "ella"
version = "0.1.0"
description = "A statically typed language for learning, from tokenizer to x64"
readme = "README.md"
authors = [
    { name = "Steve Marin" }
]
requires-python = ">=3.15.2"
dependencies = []

[project.scripts]
ella = "ella:main"

[build-system]
requires = ["uv_build>=0.12.4,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipython>=9.18.0",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]

[tool.ruff]
line-length = 119

[tool.pytest.ini_options]
testpaths = ["test"]

[tool.mypy]
strict = true
files = ["src", "test"]
